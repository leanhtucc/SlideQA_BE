services:
  db:
    image: postgres:16
    container_name: slideqa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slideqa_user
      POSTGRES_PASSWORD: slideqa_pass
      POSTGRES_DB: slideqa_db
    ports:
      - "5432:5432"
    volumes:
      - slideqa-data:/var/lib/postgresql/data

volumes:
  slideqa-data:
